<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Costa Serena — Open World Kriminal 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1b2e;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #f2ede2; }
  #game, #game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #topbar { position: absolute; top: 14px; left: 18px; right: 18px; display: flex;
    justify-content: space-between; align-items: flex-start; }
  #wanted { font-size: 30px; letter-spacing: 4px; color: #3a3f46;
    text-shadow: 0 0 6px rgba(0,0,0,.8); }
  #wanted.hot { color: #ffd23a; text-shadow: 0 0 12px rgba(255,60,40,.9); }
  #cash { font-size: 26px; font-weight: 700; color: #7ee787;
    text-shadow: 0 2px 6px rgba(0,0,0,.85); }
  #objective { position: absolute; top: 64px; left: 18px; max-width: 380px;
    background: rgba(10,16,24,.62); border-left: 4px solid #ffd23a;
    padding: 10px 14px; border-radius: 0 8px 8px 0; }
  #obj-main { font-size: 16px; font-weight: 650; }
  #obj-sub { font-size: 13px; color: #ffd23a; margin-top: 3px; }
  #obj-dist { font-size: 13px; color: #bcd8e8; margin-top: 2px; }
  #healthbar { position: absolute; bottom: 22px; left: 18px; width: 220px; height: 12px;
    background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.35); border-radius: 6px; overflow: hidden; }
  #healthfill { height: 100%; width: 100%; background: #3fae5a; }
  #speed { position: absolute; bottom: 44px; right: 210px; font-size: 26px; font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,.9); }
  #minimap { position: absolute; bottom: 18px; right: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.55); box-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 26px; color: rgba(255,255,255,.9); text-shadow: 0 0 4px #000; display: none; }
  #toasts { position: absolute; top: 150px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: rgba(10,16,24,.78); border: 1px solid rgba(255,255,255,.25);
    padding: 8px 16px; border-radius: 20px; font-size: 15px; font-weight: 600;
    transition: opacity .8s; white-space: nowrap; }
  .toast.good { border-color: #3fae5a; color: #9fe8ae; }
  .toast.bad { border-color: #c23a3a; color: #ffb0a0; }
  .toast.fade { opacity: 0; }
  #vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(160,0,0,.55) 100%); }
  #hint { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,.55); text-shadow: 0 1px 3px #000; white-space: nowrap; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: linear-gradient(180deg, rgba(8,14,24,.25) 0%, rgba(8,14,24,.78) 78%);
    pointer-events: auto; padding: 20px; }
  .screen.hidden { display: none; }
  .title-kicker { letter-spacing: 5px; font-size: 13px; color: #ffd23a; font-weight: 700; }
  .screen h1 { font-size: 84px; line-height: .9; font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 6px 30px rgba(0,0,0,.7); color: #fff; }
  .screen h2 { font-size: 52px; font-weight: 900; }
  .tagline { max-width: 560px; font-size: 17px; line-height: 1.5; color: #dfe8ee; }
  .controls { font-size: 13px; color: #aebfce; }
  .screen button { pointer-events: auto; cursor: pointer; font-size: 18px; font-weight: 700;
    padding: 14px 34px; border-radius: 30px; border: none; color: #14100a;
    background: linear-gradient(180deg, #ffd23a, #f2a93a);
    box-shadow: 0 6px 22px rgba(242,169,58,.5); margin-top: 6px; }
  .screen button:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
