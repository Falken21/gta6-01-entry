<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costa Serena — Kota Pesisir yang Hidup</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a1410;font-family:Georgia,'Times New Roman',serif;color:#fff}
  #app{position:fixed;inset:0}
  #app canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #topbar{position:absolute;top:12px;left:14px;display:flex;gap:16px;align-items:center}
  .stars{font-size:26px;letter-spacing:2px;color:#ffd23e;text-shadow:0 2px 6px #000}
  .stars.hot{color:#ff5040;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  #health{width:150px;height:12px;background:rgba(0,0,0,.55);border:1px solid #fff3;border-radius:6px;overflow:hidden}
  #health-fill{height:100%;width:100%;background:linear-gradient(90deg,#37c978,#a8e063)}
  #cash{font-size:22px;font-weight:bold;text-shadow:0 2px 4px #000}
  #objective{position:absolute;top:12px;right:14px;max-width:380px;text-align:right;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:8px;font-size:15px;line-height:1.35}
  #speed{position:absolute;bottom:16px;right:18px;font-size:34px;font-weight:bold;text-shadow:0 2px 8px #000}
  #minimap{position:absolute;bottom:14px;left:14px;width:150px;height:150px;border:2px solid rgba(255,255,255,.65);border-radius:8px;background:rgba(10,16,24,.8)}
  #toast{position:absolute;bottom:180px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:10px 18px;border-radius:8px;font-size:17px;opacity:0;transition:opacity .4s;text-align:center;max-width:640px}
  .overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(20,16,40,.55),rgba(5,5,12,.88));z-index:10;pointer-events:auto;cursor:pointer}
  .overlay h1{font-size:64px;margin:0;letter-spacing:6px;color:#ffd98a;text-shadow:0 4px 24px rgba(255,150,50,.6)}
  .overlay p{font-size:18px;max-width:640px;line-height:1.5}
  .overlay .small{font-size:14px;opacity:.8}
  #crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:rgba(255,255,255,.85);text-shadow:0 0 4px #000;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="topbar"><div id="stars" class="stars">☆☆☆☆☆</div><div id="health"><div id="health-fill"></div></div><div id="cash">$0</div></div>
  <div id="objective"></div>
  <div id="speed"></div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="toast"></div>
  <div id="crosshair">+</div>
</div>
<div id="title" class="overlay"></div>
<div id="pause" class="overlay"></div>
<div id="gameover" class="overlay"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
